<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safe Landing — Ms Mahrukh</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:var(--bg1);color:var(--white)}
    .wrap{padding:28px;}
    .message{max-width:820px;margin:0 auto}
    .card-rect{fill:#fff;stroke:#e6e6e6;stroke-width:1;rx:12;ry:12}
    .card-text{fill:#072033;font-weight:600}
    .confetti {margin-top:18px; font-size:28px; opacity:0.95}
    .home{
      display:inline-block;
      margin-top:18px;
      background:var(--accent);
      color:#072033;
      padding:10px 16px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
    }
    .mouse-svg{display:block;margin:10px auto 6px;max-width:420px;width:min(92vw,420px)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="message safe-wrap">
      <h1>Safe landing! 🎉</h1>
      <p>Great kick, Ms Mahrukh — you landed safely on this page.</p>

      <!-- Friendly original mouse illustration holding a sign -->
      <svg class="mouse-svg" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="friendly mouse holding a card">
        <!-- card -->
        <rect x="120" y="170" width="400" height="160" rx="18" ry="18" class="card-rect"/>
        <text x="140" y="208" font-size="20" class="card-text">
          <tspan x="140" dy="0">your foot will be fine soon</tspan>
          <tspan x="140" dy="28">don't stress about it and just</tspan>
          <tspan x="140" dy="28">enjoyyy your time yrr</tspan>
        </text>

        <!-- mouse body -->
        <!-- ears -->
        <circle cx="180" cy="90" r="48" fill="#f6c8a8"/>
        <circle cx="250" cy="60" r="42" fill="#f6c8a8"/>
        <!-- head -->
        <ellipse cx="220" cy="120" rx="70" ry="72" fill="#f6c8a8"/>
        <!-- eyes -->
        <circle cx="200" cy="115" r="8" fill="#222"/>
        <circle cx="240" cy="115" r="8" fill="#222"/>
        <!-- nose -->
        <ellipse cx="220" cy="136" rx="10" ry="7" fill="#c94a5b"/>
        <!-- smile -->
        <path d="M195 145 Q220 160 245 145" stroke="#c94a5b" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- arms (holding card) -->
        <path d="M160 180 Q150 200 170 220" stroke="#f6c8a8" stroke-width="14" stroke-linecap="round" fill="none"/>
        <path d="M280 180 Q320 210 350 200" stroke="#f6c8a8" stroke-width="14" stroke-linecap="round" fill="none"/>

        <!-- feet -->
        <ellipse cx="200" cy="260" rx="30" ry="14" fill="#d9a788" opacity="0.95"/>
        <ellipse cx="260" cy="260" rx="30" ry="14" fill="#d9a788" opacity="0.95"/>

        <!-- optional small ball to keep theme -->
        <text x="520" y="330" font-size="46">⚽</text>
      </svg>

      <div class="confetti">🎊 🎈 🎉</div>
      <a class="home" href="index.html" aria-label="Go back to landing">Back to landing</a>
    </div>
  </div>
</body>
</html>
