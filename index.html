<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ms Mahrukh — Kick for a Safe Landing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bg"></div>

  <main class="container">
    <header class="hero">
      <h1>Welcome, Ms Mahrukh</h1>
      <p class="lead">Kick the ball with your left foot for a safe landing to the next page.</p>
    </header>

    <section class="arena" aria-label="kick arena">
      <button id="leftFootVisual" class="left-foot" aria-hidden="true">👣</button>

      <div id="ball" class="ball" role="img" aria-label="football">⚽</div>
    </section>

    <div class="controls">
      <button id="kickBtn" class="kick" aria-label="Kick the ball with your left foot, Ms Mahrukh">
        Kick with left foot — Ms Mahrukh
      </button>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
